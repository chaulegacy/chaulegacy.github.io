<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services | Christopher Chau, Independent Insurance Consultant</title>
<meta name="description" content="Clear explanations of your strategic options, from designing custom new coverage to executing an advanced, second-look audit at what you already have.">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D; --navy-2:#1F2F52; --gold:#B08D57; --gold-soft:#F3EBDD;
  --ink:#2B3440; --muted:#5F6B7A; --line:#E6E8EC; --bg:#FAF9F6; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--white);line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;color:var(--navy);line-height:1.2}
a{color:var(--navy)}
.container{max-width:1080px;margin:0 auto;padding:0 22px}
section{padding:76px 0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.section-title{font-size:34px;margin-bottom:14px}
.section-sub{color:var(--muted);max-width:640px;margin-bottom:42px}
.center{text-align:center}.center .section-sub{margin-left:auto;margin-right:auto}
.alt{background:var(--bg)}

/* Header & Navigation Layout */
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0;flex-wrap:nowrap;gap:24px}
.brand{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;color:var(--navy);text-decoration:none;white-space:nowrap}
.links{display:flex;gap:24px;align-items:center}
.nav a.link{color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;padding-bottom:3px;border-bottom:2px solid transparent;transition:color 0.2s}
.nav a.link:hover{color:var(--gold)}
.nav a.link.active{border-bottom-color:var(--gold);color:var(--navy)}

/* Buttons */
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:12px 24px;border-radius:4px;font-weight:600;font-size:14px;border:none;cursor:pointer;transition:.2s;font-family:inherit;white-space:nowrap;text-align:center}
.btn:hover{background:var(--navy-2);transform:translateY(-1px)}
.btn.small{padding:10px 20px;font-size:14px}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);margin-left:10px}
.btn.ghost:hover{background:var(--navy);color:#fff}

/* Mobile Architecture Enhancements */
@media(max-width:820px){
  .nav{flex-wrap:wrap;justify-content:space-between;padding:12px 0}
  .links{order:3;width:100%;justify-content:space-around;gap:10px;padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
  .nav a.link{font-size:13px}
  .brand{font-size:20px}
}
@media(max-width:480px){
  .btn.ghost{margin-left:0;margin-top:10px}
  .nav .btn{padding:8px 14px;font-size:12px}
}

/* Hero Section */
.hero{background:linear-gradient(180deg,var(--bg),#fff);padding:76px 0 66px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hero h1{font-size:44px;margin-bottom:18px}
.hero p.lead{font-size:18px;color:var(--muted);margin-bottom:30px;max-width:540px}
.trust{display:flex;gap:30px;flex-wrap:wrap;margin-top:34px;font-size:13px;color:var(--muted)}
.trust b{display:block;font-family:'Playfair Display',serif;font-size:26px;color:var(--navy)}
.photo-wrap{position:relative;max-width:380px;margin:0 auto}
.photo-wrap::before{content:"";position:absolute;inset:18px -18px -18px 18px;border:2px solid var(--gold);border-radius:10px;z-index:0}
.photo-wrap img{position:relative;z-index:1;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;display:block;background:var(--gold-soft);box-shadow:0 18px 40px rgba(20,33,61,.15)}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr;text-align:center}.hero p.lead{margin-left:auto;margin-right:auto}.trust{justify-content:center}.hero h1{font-size:34px}.photo-wrap{order:-1;max-width:270px}}

/* Inner Page Header */
.page-head{background:linear-gradient(180deg,var(--bg),#fff);padding:60px 0 44px;text-align:center;border-bottom:1px solid var(--line)}
.page-head h1{font-size:38px;margin-bottom:10px}
.page-head p{color:var(--muted);max-width:620px;margin:0 auto}
@media(max-width:600px){.page-head h1{font-size:30px}}

/* Asymmetric Organic Cards Layout */
.cards-asymmetric {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  margin-top: 32px;
  text-align: left;
}

/* Make wide cards span full width across both grid columns */
.card-wide {
  grid-column: span 2;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 24px;
  align-items: start;
}

.card-organic {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 36px;
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  min-height: auto;
}

.card-organic:hover {
  box-shadow: 0 16px 36px rgba(20,33,61,.06);
  transform: translateY(-2px);
  border-color: var(--gold);
}

.icon{width:42px;height:42px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:16px;flex-shrink:0}

.card-organic h3 {
  font-size: 21px;
  margin-bottom: 12px;
  font-family: 'Playfair Display', serif;
  color: var(--navy);
}

.card-organic p {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.65;
}

/* Alternate Left-Aligned Row Layout for 'Who I Help' Section */
.who-i-help-flex {
  display: flex;
  flex-direction: column;
  gap: 24px;
  margin-top: 32px;
  text-align: left;
}

.help-row {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 40px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 32px;
  align-items: start;
}

.help-row:last-child {
  border-bottom: none;
}

.help-row h3 {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  color: var(--navy);
  padding-top: 4px;
}

.help-row p {
  font-size: 15.5px;
  color: var(--muted);
  line-height: 1.7;
}

.help-row a.more {
  display: inline-block;
  margin-top: 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--navy);
  text-decoration: none;
  border-bottom: 1.5px solid var(--gold);
  transition: color 0.2s;
}
.help-row a.more:hover {
  color: var(--gold);
}

/* Two Column Layout (Portfolio Reviews & Audits) */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.checks{list-style:none}
.checks li{padding:16px 0 16px 40px;border-bottom:1px solid var(--line);position:relative;font-size:15px;line-height:1.6;color:var(--ink)}
.checks li::before{content:"";position:absolute;left:0;top:16px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:bold}
.checks li b{color:var(--navy);font-size:16px}
.note{font-size:12.5px;color:var(--muted);margin-top:20px;line-height:1.5;font-style:italic}
@media(max-width:820px){
  .two{grid-template-columns:1fr;gap:40px}
  .cards-asymmetric { grid-template-columns: 1fr; }
  .card-wide { grid-column: span 1; grid-template-columns: 1fr; gap: 12px; }
  .help-row { grid-template-columns: 1fr; gap: 12px; padding-bottom: 24px; }
}

/* About Section Styles */
.about{padding:80px 0}
.about p{margin-bottom:18px;font-size:16px;line-height:1.7;color:var(--ink)}
.pledge{background:var(--gold-soft);border-left:4px solid var(--gold);padding:24px 28px;border-radius:0 8px 8px 0;box-shadow:0 4px 15px rgba(176,141,87,0.05)}
.pledge h3{font-size:22px;margin-bottom:14px;font-family:'Playfair Display',serif;color:var(--navy)}
.pledge ul{list-style:none}
.pledge li{padding:8px 0 8px 24px;position:relative;font-size:15px;line-height:1.5;color:var(--ink)}
.pledge li::before{content:"•";position:absolute;left:4px;color:var(--gold);font-weight:700;font-size:18px;top:4px}
.pledge li strong{color:var(--navy-2)}
.about-photo{max-width:320px;margin:0 0 28px;position:relative}
.about-photo img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;display:block;background:var(--gold-soft);box-shadow:0 12px 30px rgba(20,33,61,.12)}
@media(max-width:820px){.about-photo{margin:0 auto 24px}}

/* Process Section (How It Works) */
.process{background:var(--navy);padding:80px 0}
.process .section-title{color:#fff}.process .section-sub{color:#B8C2D3;margin-bottom:50px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:36px}
.step .num{font-family:'Playfair Display',serif;font-size:42px;color:var(--gold);font-weight:700}
.step h3{color:#fff;font-size:20px;margin:6px 0 10px;font-family:'Inter',sans-serif;font-weight:600}
.step p{font-size:14.5px;color:#B8C2D3;line-height:1.6}

/* CTA Strip Section */
.cta{background:var(--gold-soft);padding:64px 0;text-align:center}
.cta h2{font-size:32px;margin-bottom:12px;font-family:'Playfair Display',serif;color:var(--navy)}
.cta p{color:var(--ink);font-size:16px;margin-bottom:26px}

/* Institutional Footer Layout */
footer{background:#0E1730;color:#9AA6BC;padding:56px 0 30px;font-size:13px;text-align:left}
footer h3{color:#fff;font-size:17px;margin-bottom:12px;font-family:'Inter',sans-serif;font-weight:600;letter-spacing:0.02em}
.foot-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:40px}
@media(max-width:720px){.foot-grid{grid-template-columns:1fr;gap:30px}}
footer a{color:#fff;text-decoration:none;transition:color 0.2s ease}
footer a:hover{color:var(--gold)}
.states{line-height:1.9;font-size:12px;color:#9AA6BC}
